[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-dounce"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_dounce = "rdb_dounce.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
dounce_scripted = "rdb_dounce.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
dounce_score = "rdb_dounce.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_dounce*"]

[tool.setuptools.package-data]
rdb_dounce = ["dounce.usda"]
