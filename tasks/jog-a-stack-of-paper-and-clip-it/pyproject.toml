[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-paper-jog"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_paper_jog = "rdb_paper_jog.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
paper_jog_scripted = "rdb_paper_jog.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
paper_jog_score = "rdb_paper_jog.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_paper_jog*"]

[tool.setuptools.package-data]
rdb_paper_jog = ["paper_jog.usda"]
