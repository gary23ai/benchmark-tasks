[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-child-latch"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_child_latch_drawer = "rdb_child_latch.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
child_latch_scripted = "rdb_child_latch.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
child_latch_score = "rdb_child_latch.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_child_latch*"]

[tool.setuptools.package-data]
rdb_child_latch = ["drawer.usda"]
