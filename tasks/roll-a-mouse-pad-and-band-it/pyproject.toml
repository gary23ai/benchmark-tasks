[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-pad-roll"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_pad_roll = "rdb_pad_roll.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
pad_roll_scripted = "rdb_pad_roll.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
pad_roll_score = "rdb_pad_roll.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_pad_roll*"]

[tool.setuptools.package-data]
rdb_pad_roll = ["pad.usda"]
