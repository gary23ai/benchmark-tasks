[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-sprayer-relief"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["inspect-robots==1.0.0", "inspect-robots-yam==0.38.0", "yam-arena==0.1.0", "numpy>=1.26", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]"]

[project.entry-points."inspect_robots.embodiments"]
yam_sprayer_relief = "rdb_sprayer_relief.adapter:make_embodiment"

[project.entry-points."inspect_robots.policies"]
sprayer_relief_scripted = "rdb_sprayer_relief.adapter:make_scripted"

[project.entry-points."inspect_robots.scorers"]
sprayer_relief_score = "rdb_sprayer_relief.grading:make_scorer"

[tool.setuptools.packages.find]
include = ["rdb_sprayer_relief*"]

[tool.setuptools.package-data]
rdb_sprayer_relief = ["sprayer.usda"]
